name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew test --stacktrace

      - name: Compilar APK
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: isla-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Publicar release descargable desde el móvil
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Isla build ${{ github.run_number }}
          body: APK compilado automáticamente desde ${{ github.sha }}. Instala `app-release.apk`.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
