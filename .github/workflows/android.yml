name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests unitarios
        run: ./gradlew test --continue 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Compilar APK
        run: ./gradlew assembleDebug assembleRelease 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      # Publica los errores como anotaciones (visibles sin iniciar sesión en GitHub).
      - name: Resumen de errores
        if: failure()
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            grep -E '^e: |^w: .*error|FAILED|What went wrong|^> |Exception|expected:|Could not|Unresolved|^\s+at com\.chema' "$f" \
              | grep -v '^> Task' | head -n 60 > "$f.err" || true
            msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' "$f.err")
            [ -n "$msg" ] && echo "::error title=$f::$msg"
          done

      - name: Informe de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'

      - name: Subir APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: isla-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk

      - name: Publicar release descargable desde el móvil
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Isla build ${{ github.run_number }}
          body: APK compilado automáticamente desde ${{ github.sha }}. Instala `app-release.apk`.
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
